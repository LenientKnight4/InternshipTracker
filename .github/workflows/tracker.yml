name: internship-tracker

on:
  schedule:
    # Every 30 minutes (offset from :00, when GitHub's scheduler is busiest).
    # Private repo? Change to "17 * * * *" (hourly) to stay inside the free 2,000 minutes/month.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      sync_sheet:
        description: "Also copy every open AM/ER + related posting into the Google Sheet"
        type: boolean
        default: false
      test_push:
        description: "Just send a test notification to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check firms
        run: python run.py ${{ inputs.sync_sheet && '--sync-sheet' || '' }} ${{ inputs.test_push && '--test-push' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}

      - name: Save state and dashboard
        run: |
          git config user.name "internship-tracker"
          git config user.email "internship-tracker@users.noreply.github.com"
          git add data JOBS.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "tracker: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
