# Every firm the tracker checks. Endpoints were verified on 2026-11-04.
#
# kind: credit = credit specialist. Any internship there that isn't tech/ops/HR etc. is an instant push.
# kind: am     = asset manager / buy-side. AM/ER/credit internships are instant pushes,
#                other business internships there are a grouped push.
# kind: bank   = only AM / ER / credit / research / wealth internships are pushed.
#
# To add a firm, click "Apply" on any of its jobs and look at the URL:
#   <tenant>.wd<N>.myworkdayjobs.com/<site>/...      -> type: workday
#   boards.greenhouse.io/<board>/...                  -> type: greenhouse
#   jobs.lever.co/<company>/...                       -> type: lever
#   jobs.ashbyhq.com/<board>/...                      -> type: ashby
#   <host>/hcmUI/CandidateExperience/en/sites/<site>  -> type: oracle
#   <host>.tal.net/...                                -> type: oleeo (paste the job board URL)
#   careers-<name>.icims.com/...                      -> type: icims, base: https://careers-<name>.icims.com
#   anything else                                     -> type: page (watches the page for new internship text)

