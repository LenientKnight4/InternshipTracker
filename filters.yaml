# What counts as a match. All phrases are case-insensitive whole words/phrases.

# Summers you're recruiting for. Postings that name a different year are ignored.
# Postings with no year in the title are kept.
target_years: [2027, 2028]

# Search terms sent to each careers site. The target years above are added automatically.
search_terms: [internship, summer]

# A posting must contain one of these to count as an internship at all.
# ("intern" is matched as a whole word, so "Internal Audit" doesn't count.)
early_career:
  - intern
  - interns
  - internship
  - internships
  - summer analyst
  - summer analysts
  - summer program
  - summer programme
  - summer internship
  - co-op
  - early insight
  - early insights
  - insight program
  - insight programme
  - sophomore
  - freshman
  - first-year

# Never shown: wrong level for an undergrad.
exclude:
  - mba
  - pre-mba
  - summer associate
  - summer associates
  - phd
  - ph.d
  - ms/phd
  - doctoral
  - postdoc
  - full-time
  - full time
  - vice president
  - executive director
  - managing director
  - experienced
  - jd
  - law student
  - masters
  - master's
  - graduate programme
  - apprenticeship
  - apprenticeship programme

# Shown on the dashboard only (no push): recruiting events rather than applications.
